input:
  tif_dir: 'tif'
  shp_path: 'River.shp'
  out_dir: 'River\1024'

slice:
  crop_size: 1024
  overlap: 0.1
  suffix: 'n'
  palette:
    field: 'type'
    classes: ['休耕', '河流湖泊']
    colors: [[255, 255, 255], [255, 0, 0]]

filter:
  background_threshold: 0.95

dataset:
  val_ratio: 0.1

steps:
  slice: true
  filter: true
  to_txt: true
  dataset: true
